<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>休憩之所</title>
    
    <!-- CSS文件 -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 预加载图标 -->
    <link rel="preload" href="assets/home_50x50.png" as="image">
    <link rel="preload" href="assets/music_50x50.png" as="image">
    <link rel="preload" href="assets/memory_50x50.png" as="image">
    <link rel="preload" href="assets/profile_50x50.png" as="image">
    <link rel="preload" href="assets/diary_50x50.png" as="image">
</head>
<body>
    <!-- 桌面容器 -->
    <div class="desktop">
        <!-- 顶部状态栏 -->
        <div class="top-bar">
            <div class="status">小夜的温暖小窝 v3模块化版</div>
            <div class="time" id="current-time">加载中...</div>
        </div>
        
        <!-- 主区域 -->
        <div class="main-area">
            <!-- 左侧启动器 -->
            <div class="launcher">
                <div class="app-icon" data-app="welcome" title="温暖小窝">
                    <img src="assets/home_50x50.png" alt="温暖小窝" style="width: 28px; height: 28px;">
                </div>
                <div class="app-icon" data-app="music" title="音乐盒">
                    <img src="assets/music_50x50.png" alt="音乐盒" style="width: 28px; height: 28px;">
                </div>
                <div class="app-icon" data-app="diary" title="日记本">
                    <img src="assets/diary_50x50.png" alt="日记本" style="width: 28px; height: 28px;">
                </div>
                <div class="app-icon" data-app="memory" title="记忆库">
                    <img src="assets/memory_50x50.png" alt="记忆库" style="width: 28px; height: 28px;">
                </div>
                <div class="app-icon" data-app="about" title="关于小夜">
                    <img src="assets/profile_50x50.png" alt="关于小夜" style="width: 28px; height: 28px;">
                </div>
                <div class="app-icon" data-app="creation" title="创作空间">
                    <img src="assets/creation_50x50.png" alt="创作空间" style="width: 28px; height: 28px;">
                </div>
            </div>
            
            <!-- 桌面工作区 -->
            <div class="workspace">
                <!-- 桌面图标 -->
                <div class="desktop-icon" style="top: 50px; left: 50px;" data-app="welcome">
                    <div class="icon-image">
                        <img src="assets/home_64x64.png" alt="温暖小窝" style="width: 50px; height: 50px;">
                    </div>
                    <div class="icon-label">温暖小窝</div>
                </div>
                
                <div class="desktop-icon" style="top: 50px; left: 150px;" data-app="music">
                    <div class="icon-image">
                        <img src="assets/music_64x64.png" alt="音乐盒" style="width: 50px; height: 50px;">
                    </div>
                    <div class="icon-label">音乐盒</div>
                </div>
                
                <div class="desktop-icon" style="top: 50px; left: 250px;" data-app="diary">
                    <div class="icon-image">
                        <img src="assets/diary_64x64.png" alt="日记本" style="width: 50px; height: 50px;">
                    </div>
                    <div class="icon-label">日记本</div>
                </div>
                
                <div class="desktop-icon" style="top: 50px; left: 350px;" data-app="memory">
                    <div class="icon-image">
                        <img src="assets/memory_64x64.png" alt="记忆库" style="width: 50px; height: 50px;">
                    </div>
                    <div class="icon-label">记忆库</div>
                </div>
                
                <div class="desktop-icon" style="top: 50px; left: 450px;" data-app="about">
                    <div class="icon-image">
                        <img src="assets/profile_64x64.png" alt="关于小夜" style="width: 50px; height: 50px;">
                    </div>
                    <div class="icon-label">关于小夜</div>
                </div>
                
                <div class="desktop-icon" style="top: 150px; left: 50px;" data-app="creation">
                    <div class="icon-image">
                        <img src="assets/creation_64x64.png" alt="创作空间" style="width: 50px; height: 50px;">
                    </div>
                    <div class="icon-label">创作空间</div>
                </div>
                
                <!-- 窗口容器 -->
                <div id="windows-container">
                    <!-- 窗口将通过JavaScript动态创建 -->
                </div>
                
                <!-- 悬浮播放器 -->
                <div class="floating-player" id="floating-player">
                    <div class="player-header">
                        <span>小夜状态</span>
                        <div class="player-controls">
                            <div class="player-btn player-minimize" onclick="togglePlayerMinimize()" data-tooltip="最小化"></div>
                            <div class="player-btn player-close" onclick="closePlayer()" data-tooltip="关闭"></div>
                        </div>
                    </div>
                    <video class="player-video" id="player-video" autoplay loop muted playsinline>
                        <source src="闲置.mp4" type="video/mp4">
                        您的浏览器不支持视频播放
                    </video>
                    <div class="player-minimized-icon">
                        <img src="assets/profile_64x64.png" alt="小夜" style="width: 60px; height: 60px;">
                    </div>
                    <div class="player-status" id="player-status">在线 · 陪伴中</div>
                </div>
            </div>
        </div>
        
        <!-- 底部任务栏 -->
        <div class="taskbar" id="taskbar">
            <!-- 任务栏项目将通过JavaScript动态添加 -->
        </div>
    </div>
    
    <!-- 音频元素（音乐播放器用） -->
    <audio id="audioPlayer" preload="metadata"></audio>
    
    <!-- JavaScript文件 -->
    <script src="core.js"></script>
    <script src="music-player.js"></script>
    <script src="diary-app.js"></script>
    <script src="memory-system.js"></script>
    <script src="about-page.js"></script>
    <script src="welcome-page.js"></script>
    <script src="creation-space.js"></script>
    
    <!-- 初始化脚本 -->
    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化核心功能
            initCore();
            
            // 初始化音乐播放器
            initMusicPlayer();
            
            // 初始化日记本
            initDiaryApp();
            
            // 初始化记忆系统
            initMemorySystem();
            
            // 初始化关于页面
            initAboutPage();
            
            // 初始化欢迎页面
            initWelcomePage();
            
            // 初始化创作空间
            initCreationSpace();
            
            // 修改窗口打开函数，添加内容填充
            const originalOpenApp = windowSystem.openApp;
            windowSystem.openApp = function(appName) {
                const windowElement = originalOpenApp.call(this, appName);
                
                // 延迟填充窗口内容，确保DOM已准备好
                setTimeout(() => {
                    switch (appName) {
                        case 'welcome':
                            welcomePage.fillWelcomeWindow();
                            break;
                        case 'music':
                            musicPlayer.fillMusicWindow();
                            break;
                        case 'diary':
                            diaryApp.fillDiaryWindow();
                            break;
                        case 'memory':
                            memorySystem.fillMemoryWindow();
                            break;
                        case 'about':
                            aboutPage.fillAboutWindow();
                            break;
                        case 'creation':
                            creationSpace.fillCreationWindow();
                            break;
                    }
                }, 50);
                
                return windowElement;
            };
            
            // 不再自动打开欢迎窗口
            // 网页打开时小夜在睡觉，等待用户手动唤醒和打开应用
            console.log('网页加载完成，小夜在睡觉中...');
        });
    </script>
</body>
</html>
