<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小夜旅行">
<title>小夜的旅行 · 休憩之所</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1028;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  padding: 20px;
}

.game-container {
  width: 520px;
  background: linear-gradient(170deg, #fcf6ec 0%, #f3eadc 100%);
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px #c4b898 inset;
  overflow: hidden;
  min-height: 600px;
  transition: filter 0.8s ease;
}

.game-container.fog-mode {
  filter: grayscale(0.5) brightness(0.75);
  position: relative;
}

.game-container.fog-mode::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 10;
  background: radial-gradient(ellipse at 30% 50%, transparent 30%, rgba(180,170,160,0.15) 70%);
  animation: fogDrift 12s ease-in-out infinite alternate;
}

.game-container.fog-boss {
  filter: grayscale(0.4) brightness(0.5) sepia(0.2);
  position: relative;
}

.game-container.fog-boss::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 10;
  background: radial-gradient(ellipse at 50% 40%, transparent 20%, rgba(100,80,120,0.25) 70%);
  animation: fogDrift 8s ease-in-out infinite alternate;
}

.game-container.sun-mode {
  filter: none;
}

@keyframes fogDrift {
  0% { transform: translateX(-5%) scale(1); opacity: 0.6; }
  50% { transform: translateX(3%) scale(1.05); opacity: 0.9; }
  100% { transform: translateX(5%) scale(0.95); opacity: 0.6; }
}

.header {
  background: linear-gradient(135deg, #3a2450, #2a1a3a);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-title { color: #e8dcc8; font-size: 20px; font-weight: 900; letter-spacing: 3px; }
.header-sub { color: #a08870; font-size: 12px; }

.main-area {
  padding: 24px;
  min-height: 400px;
  position: relative;
}

/* 小夜状态区 */
.ye-status {
  text-align: center;
  padding: 16px;
  background: #f0e6d8;
  border-radius: 12px;
  margin-bottom: 16px;
}

.ye-avatar {
  width: 100px;
  height: 100px;
  margin: 0 auto 8px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid #d4b896;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ye-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ye-name { font-size: 18px; font-weight: 900; color: #2a1a3a; }
.ye-state { font-size: 14px; color: #8b7355; margin-top: 4px; }
.ye-location { font-size: 13px; color: #a08870; margin-top: 2px; }

/* 倒计时 */
.timer-area {
  text-align: center;
  padding: 12px;
  margin-bottom: 16px;
}

.timer-label { font-size: 13px; color: #8b7355; }
.timer-count { font-size: 28px; font-weight: 900; color: #3a2450; letter-spacing: 2px; }

/* 消息区域 */
.message-area {
  background: #fffbf5;
  border: 1px solid #d4c5a0;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
  min-height: 80px;
}

.message-text {
  font-size: 15px;
  line-height: 1.8;
  color: #3a2a1a;
}

/* 明信片卡片 */
.postcard {
  background: linear-gradient(145deg, #f5ede0, #fdf8f0);
  border: 1px solid #d4c5a0;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  position: relative;
}

.postcard-title {
  font-size: 16px;
  font-weight: 700;
  color: #3a2450;
  margin-bottom: 4px;
}

.postcard-from {
  font-size: 12px;
  color: #a08870;
  margin-bottom: 8px;
}

.postcard-text {
  font-size: 14px;
  line-height: 1.8;
  color: #3a2a1a;
}

/* 收集品网格 */
.collection-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.collection-item {
  background: #f0e6d8;
  border: 1px solid #d4c5a0;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  color: #3a2a1a;
}

.collection-item .item-icon { margin-right: 4px; }
.album-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
.album-item { display: flex; flex-direction: column; align-items: center; padding: 6px; border-radius: 8px; background: rgba(255,255,255,0.05); transition: 0.2s; }
.album-item:hover { background: rgba(255,255,255,0.12); }
.album-icon { width: 40px; height: 40px; object-fit: contain; border-radius: 4px; }
.album-placeholder { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #887a60; background: rgba(255,255,255,0.05); border-radius: 4px; }
.album-name { font-size: 10px; color: #d4c5a0; text-align: center; margin-top: 3px; line-height: 1.2; }
.album-name.missing { color: #887a60; }

/* 明信片图片 */
.postcard-image {
  margin: -16px -16px 12px -16px;
  border-radius: 8px 8px 0 0;
  overflow: hidden;
}

.postcard-image img {
  width: 100%;
  height: 320px;
  display: block;
  object-fit: cover;
  object-position: center 12%;
  cursor: pointer;
  transition: filter 0.2s;
}

.postcard-image img:hover {
  filter: brightness(0.95);
}

/* 全图查看灯箱 */
.lightbox {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 6, 20, 0.92);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  padding: 20px;
  cursor: zoom-out;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 100%;
  max-height: 95vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 10px 60px rgba(0,0,0,0.6);
  cursor: default;
}

.lightbox-close {
  position: fixed;
  top: 16px;
  right: 20px;
  font-size: 32px;
  color: #e8dcc8;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s;
  line-height: 1;
  z-index: 10000;
}

.lightbox-close:hover {
  opacity: 1;
}

@keyframes lightboxFadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.lightbox.active img {
  animation: lightboxFadeIn 0.25s ease;
}

/* 按钮 */
.action-btn {
  display: inline-block;
  background: linear-gradient(135deg, #3a2450, #2a1a3a);
  color: #e8dcc8;
  border: none;
  border-radius: 8px;
  padding: 10px 24px;
  font-size: 14px;
  font-family: 'Noto Serif SC', serif;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 1px;
  width: 100%;
}

.action-btn:hover { background: linear-gradient(135deg, #4a3060, #3a2450); }
.action-btn:disabled { background: #c4b8a0; color: #a08870; cursor: default; }

/* 页脚选项卡 */
.tabs {
  display: flex;
  border-top: 1px solid #d4c5a0;
  background: #f5ede0;
}

.tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  font-size: 13px;
  color: #8b7355;
  cursor: pointer;
  transition: all 0.2s;
  border-bottom: 3px solid transparent;
}

.tab:hover { background: #f0e6d8; }
.tab.active { color: #3a2450; border-bottom-color: #3a2450; font-weight: 700; }

.tab-content { display: none; padding: 16px 24px; }
.tab-content.active { display: block; }

.footer {
  background: #2a1a3a;
  padding: 10px 24px;
  text-align: center;
}

.footer-text { color: #5a4a3a; font-size: 11px; }

/* 进度条 */
.progress-bar {
  height: 4px;
  background: #d4c5a0;
  border-radius: 2px;
  overflow: hidden;
  margin-top: 8px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #8ba86a, #5a7a4a);
  border-radius: 2px;
  transition: width 1s;
}

/* 动画 */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.floating { animation: float 3s ease-in-out infinite; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-slide { animation: fadeSlideIn 0.6s ease; }
</style>
</head>
<body>
<div class="game-container">
  <div class="header">
    <span class="header-title">小夜的旅行</span>
    <span class="header-sub">休憩之所 · 挂机版</span>
  </div>

  <div class="main-area">
    <!-- 小夜状态 -->
    <div class="ye-status">
      <div class="ye-avatar" id="avatarContainer">
        <img id="avatarImg" src="./happy.webp" alt="小夜" style="display:none;">
        <span id="avatarFallback" style="font-size:48px;">🐭</span>
      </div>
      <div class="ye-name">小夜 · 鸢尾夜</div>
      <div class="ye-state" id="yeState">准备出发</div>
      <div class="ye-location" id="yeLocation">休憩之所</div>
    </div>

    <!-- 计时器 -->
    <div class="timer-area">
      <div class="timer-label" id="timerLabel">下次旅行还有</div>
      <div class="timer-count" id="timerCount">--:--</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <!-- 消息/故事区 -->
    <div class="message-area" id="messageArea">
      <div class="message-text" id="messageText">按下面的按钮，让小夜出发去旅行吧～吱🫶</div>
    </div>

    <!-- 操作按钮 -->
    <button class="action-btn" id="actionBtn" onclick="sendYe()">送小夜出发！</button>

    <!-- 保存/加载 -->
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button class="action-btn" style="flex:1; font-size:12px; padding:8px; background:#5a4a3a;" onclick="saveProgress()">💾 保存进度</button>
      <button class="action-btn" style="flex:1; font-size:12px; padding:8px; background:#5a4a3a;" onclick="document.getElementById('loadFileInput').click()">📂 读取进度</button>
      <input type="file" id="loadFileInput" accept=".json" style="display:none" onchange="loadProgress(event)">
    </div>
    
    <!-- 重置 -->
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button class="action-btn" id="resetBtn" style="flex:1; font-size:12px; padding:8px; background:#6a3a3a;" onclick="confirmReset()">🗑️ 删档重玩</button>
    </div>

    <!-- 提示 -->
    <div style="margin-top:8px; text-align:center;">
      <span style="font-size:12px; color:#a08870;" id="hintText">小夜会去不同的世界旅行，带回明信片和特产哦</span>
    </div>
  </div>

  <!-- 选项卡 -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('postcards')">🏷️ 明信片</div>
    <div class="tab" onclick="switchTab('stats')">📊 能力</div>
    <div class="tab" onclick="switchTab('equipment')">🎒 装备</div>
    <div class="tab" onclick="switchTab('album')">📖 图鉴</div>
  </div>

  <div class="tab-content active fade-slide" id="tab-postcards"></div>
  <div class="tab-content" id="tab-stats"></div>
  <div class="tab-content" id="tab-equipment"></div>
  <div class="tab-content" id="tab-album"></div>

  <div class="footer">
    <span class="footer-text">小夜旅行的世界 · 每一次都是新的故事</span>
  </div>
</div>

<script>
// ========== 目的地数据 ==========
const destinations = [
  { name: "圣巢 · 王后花园", world: "空洞骑士", desc: "到处是盛开的荆棘花和飞舞的蝴蝶，空气中飘着淡淡的花粉香", items: ["荆棘花瓣", "蝶翼粉末", "古老歌谣碎片", "蝴蝶鳞粉瓶", "花后祝福"] /*5*/, img: "queens_gardens" },
  { name: "圣巢 · 蓝湖", world: "空洞骑士", desc: "宁静的湖水映着天光，湖边插着一把剑，旁边有一顶旧面具", items: ["湖水碎片", "旧面具残片", "宁静之歌", "湖底鹅卵石", "倒影水晶"] /*5*/, img: "blue_lake" },
  { name: "罗德兰 · 亚诺尔隆德", world: "黑暗之魂", desc: "雄伟的教堂之城在夕阳下闪着金色的光，银骑士在城墙上巡逻", items: ["银色碎片", "太阳徽记", "古老盾牌残片", "教堂玻璃碎", "骑士纽扣"] /*5*/, img: "anor_londo" },
  { name: "罗德兰 · 防火女祭坛", world: "黑暗之魂", desc: "营火在寂静中燃烧，一个防火女轻抚着火焰，似乎在等待什么", items: ["余烬火花", "防火女的泪滴", "营火灰烬", "熏黑的羽毛", "蜡封祈祷词"] /*5*/, img: "firekeeper_shrine" },
  { name: "魔女之国 · 和平国洛贝塔", world: "魔女之旅", desc: "一个宁静的小国，田野里开着紫色的花，远处有魔女骑着扫帚飞过", items: ["薰衣草干花", "魔女饼干", "星形护身符", "扫帚尾须", "花香信纸"] /*5*/, img: "lobeta" },
  { name: "魔女之国 · 时钟乡", world: "魔女之旅", desc: "到处都是巨大的钟表，时间的流逝在这里变得可视化", items: ["齿轮碎片", "怀表链条", "时针别针", "计时沙漏", "发条钥匙"] /*5*/, img: "clock_town" },
  { name: "休憩之所 · 森林分所", world: "小夜的秘密", desc: "树洞里藏着一个小小的房间，有炉火和书架，像是休憩之所在另一个世界的投影", items: ["橡果吊坠", "树汁墨水", "苔藓标本", "干花书签", "树脂封存的萤火虫"] /*5*/, img: "forest_branch" },
  { name: "无名之国 · 巨人陨落之森", world: "黑暗之魂", desc: "巨大的枯树与石像矗立在雾气中，远处有巨人的轮廓缓缓移动", items: ["巨人石碎片", "雾之结晶", "巨木年轮", "铁锈箭镞", "雾中花瓣"] /*5*/, img: "giants_forest" },
  { name: "环世界 · 冻原", world: "环世界", desc: "一望无际的冰原，偶尔能看到因纽特风格的帐篷和雪地鼠族村落", items: ["冰晶石", "雪鼠毛绒球", "冻原蜂蜜", "鲸骨雕刻", "极光色线团"] /*5*/, img: "tundra" },
  { name: "深海 · 沉没之城", world: "深海", desc: "古老的城市沉在幽蓝的海底，发光的鱼群在建筑之间穿梭，美丽又孤寂", items: ["发光珍珠", "珊瑚碎片", "深海回音螺", "沉船铜币", "海妖鳞片"] /*5*/, img: "sunken_city" },
  { name: "圣巢 · 泪水之城", world: "空洞骑士", desc: "永远下着雨的城市，悲伤而美丽，水面的灯光倒映着残破的宫殿", items: ["泪水结晶", "雨滴风铃", "古老城市地图碎片", "湿透的信", "灵魂余响"] /*5*/, img: "city_of_tears" },
  { name: "罗德兰 · 绘画世界", world: "黑暗之魂", desc: "一个被雪覆盖的寂静世界，仿佛时间在这里停止，远处有乌鸦在飞", items: ["雪花结晶", "乌鸦羽毛", "画布碎片", "冻结的泪滴", "白色蜡笔"] /*5*/, img: "painted_world" },
  { name: "奇妙之国 · 大人之国", world: "奇诺之旅", desc: "一个奇怪的国度，孩子长到一定年龄就要接受'成为大人'的手术，失去童真和想象力，变得'懂事'", items: ["手术刀碎片", "孩子的画本", "大人证书复印件", "褪色的玩具", "无声哨子"] /*5*/, img: "land_of_adults" },
  { name: "奇妙之国 · 温柔之国", world: "奇诺之旅", desc: "这个国家的人们从不生气，从不争吵，永远面带微笑——直到奇诺发现微笑背后的真相", items: ["假面碎片", "无声铃铛", "染泪的手帕", "微笑指南手册", "绷紧的琴弦"] /*5*/, img: "gentle_country" },
  { name: "罗德兰 · 传火祭祀场", world: "黑暗之魂", desc: "一座被灰烬环绕的圆形建筑，中央燃烧着初火，不死人和灰烬英雄们聚集在此", items: ["祭祀场灰烬", "螺旋剑碎片", "防火女眼眸", "古老钟锤", "熄灭的烛台"] /*5*/, img: "firelink_shrine" },
  { name: "圣巢 · 水晶山峰", world: "空洞骑士", desc: "整座山都由发光水晶构成，晶莹剔透的光芒在隧道中折射，美得让人移不开眼", items: ["水晶碎片", "发光棱镜", "矿工头灯", "水晶髓液", "折射之眼"] /*5*/, img: "crystal_peak" },

  { name: "终末世界 · 雪原浴池", world: "少女终末旅行", desc: "白雪覆盖的废墟中，竟然藏着一个还能冒出热气的浴池。小夜在这里泡了个舒服的热水澡，外面的暴风雪仿佛也变得温柔了。", items: ["融雪毛巾", "浴池木塞", "热蒸汽结晶", "肥皂碎片", "温热回忆"] /*5*/, img: "snow_bath" },
  { name: "终末世界 · 街灯都市", world: "少女终末旅行", desc: "深不见底的多层都市中，一盏盏街灯像星星一样点缀在废墟之间。地上散落着画了一半的地图，画地图的人已经不在了。", items: ["旧地图碎片", "街灯灯泡", "用过的铅笔", "城市指南书", "标记贴纸"] /*5*/, img: "streetlamp_city" },
  { name: "终末世界 · 飞行塔", world: "少女终末旅行", desc: "一座高塔中，未完成的飞机骨架静静立着，零件散落一地。塔顶晾着风干的鱼，窗外偶尔有风吹过金属的声音。", items: ["飞机螺丝", "风干鱼干", "飞行图纸", "工具零件", "塔顶风向标"] /*5*/, img: "flight_tower" },

// ========== 属性系统 ==========

const STAT_NAMES = { str: "力量", dex: "敏捷", int: "智慧", cha: "魅力" };

function getDefaultStats() {
  return {
    level: { str: 1, dex: 1, int: 1, cha: 1 },
    exp: { str: 0, dex: 0, int: 0, cha: 0 },
    equipment: [null, null],
    backpack: []
  };
}

let yeStats = JSON.parse(localStorage.getItem("yeStats") || "null") || getDefaultStats();

function saveYeStats() {
  localStorage.setItem("yeStats", JSON.stringify(yeStats));
}

function getStatValue(stat) {
  let base = 4 + (yeStats.level[stat] || 1);
  (yeStats.equipment || []).forEach(eq => {
    if (eq && eq.stat === stat) base += eq.bonus;
  });
  return base;
}

function getExpToNext(stat) { return ((yeStats.level[stat] || 1) * 100 + 50); }

function addStatExp(stat, amount) {
  if (!stat || amount <= 0) return;
  yeStats.exp[stat] = (yeStats.exp[stat] || 0) + amount;
  const needed = getExpToNext(stat);
  while (yeStats.exp[stat] >= needed) {
    yeStats.exp[stat] -= needed;
    yeStats.level[stat]++;
  }
  saveYeStats();
}

function rollD6() { return Math.floor(Math.random() * 6) + 1; }

function getAvailableDests() {
  return destinations.filter(d => {
    const t = destinationTracker[d.name];
    return !t || t.nextItemIdx < d.items.length;
  });
}

function canVisitAgain(dest) {
  const t = destinationTracker[dest.name];
  return !t || t.nextItemIdx < dest.items.length;
}

// ========== 检查迷雾解锁 ==========
function isAllCollected() {
  return destinations.every(d => {
    const t = destinationTracker[d.name];
    return t && t.nextItemIdx >= d.items.length;
  });
}

// ========== 迷雾运行数据 ==========
function initFogRun() {
  const selected = [
    ...fogEvents.easy.map(e => ({ ...e, tier: 'easy' })),
    ...fogEvents.medium.map(e => ({ ...e, tier: 'medium' })),
    ...fogEvents.hard.map(e => ({ ...e, tier: 'hard' }))
  ];
  // Fisher-Yates 洗牌
  for (let i = selected.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [selected[i], selected[j]] = [selected[j], selected[i]];
  }
  fogRun = {
    stages: selected,
    currentStage: 0,
    passedStages: 0,
    bossAvailable: false,
    active: true
  };
}

function getFogDifficultyLabel(tier) {
  if (tier === 'easy') return '🌱';
  if (tier === 'medium') return '🔥';
  return '💀';
}

function saveFogData() {
  localStorage.setItem("yeFogData", JSON.stringify(fogData));
}

// ========== 核心逻辑 ==========

function sendYe() {
  if (state !== STATE.IDLE) return;
  
  // 迷雾模式已解锁且未通关
  if (fogData.unlocked && !fogData.completed) {
    // Boss战模式
    if (fogRun?.bossAvailable) {
      state = STATE.FOG;
      totalTime = (15 + Math.floor(Math.random() * 6)) * 60; // 15-20分钟
      timeRemaining = totalTime;
      travelStartTime = Date.now();
      updateUI();
      document.getElementById("hintText").textContent = "👑 小夜走向雾中最深处……遗忘之主就在前方。";
      travelTimer = setInterval(() => {
        const elapsed = Math.floor((Date.now() - travelStartTime) / 1000);
        timeRemaining = Math.max(0, totalTime - elapsed);
        updateUI();
        if (timeRemaining <= 0) {
          clearInterval(travelTimer);
          fogBossFight();
        }
      }, 500);
      return;
    }
    
    // 普通迷雾挑战
    initFogRun();
    state = STATE.FOG;
    totalTime = (12 + Math.floor(Math.random() * 9)) * 60;
    timeRemaining = totalTime;
    travelStartTime = Date.now();
    updateUI();
    document.getElementById("hintText").textContent = "🌫️ 小夜走进了迷雾……";
    travelTimer = setInterval(() => {
      const elapsed = Math.floor((Date.now() - travelStartTime) / 1000);
      timeRemaining = Math.max(0, totalTime - elapsed);
      updateUI();
      if (timeRemaining <= 0) {
        clearInterval(travelTimer);
        fogArrive();
      }
    }, 500);
    return;
  }
  
  // 自由旅行（通关后）
  if (fogData.completed) {
    const allDests = [...destinations];
    currentDest = allDests[Math.floor(Math.random() * allDests.length)];
    state = STATE.TRAINING;
    totalTime = (12 + Math.floor(Math.random() * 9)) * 60;
    timeRemaining = totalTime;
    travelStartTime = Date.now();
    updateUI();
    document.getElementById("hintText").textContent = `小夜再次踏上了前往${currentDest.name}的旅途～`;
    travelTimer = setInterval(() => {
      const elapsed = Math.floor((Date.now() - travelStartTime) / 1000);
      timeRemaining = Math.max(0, totalTime - elapsed);
      updateUI();
      if (timeRemaining <= 0) {
        clearInterval(travelTimer);
        freeTravelArrive();
      }
    }, 500);
    return;
  }
  
  // 普通旅行
  const available = getAvailableDests();
  if (available.length === 0) {
    // 全部集齐！解锁迷雾模式
    fogData.unlocked = true;
    saveFogData();
    updateUI();
    document.getElementById("hintText").textContent = "🌫️ 小夜感觉有些记忆开始模糊了……迷雾之中，有什么在等待。";
    return;
  }
  
  currentDest = available[Math.floor(Math.random() * available.length)];
  totalTime = (12 + Math.floor(Math.random() * 9)) * 60;
  timeRemaining = totalTime;
  travelStartTime = Date.now();
  state = STATE.TRAVELING;
  updateUI();
  document.getElementById("hintText").textContent = `小夜正在前往 ${currentDest.name} 的路上...`;
  travelTimer = setInterval(() => {
    const elapsed = Math.floor((Date.now() - travelStartTime) / 1000);
    timeRemaining = Math.max(0, totalTime - elapsed);
    updateUI();
    if (timeRemaining <= 0) {
      clearInterval(travelTimer);
      arriveHome();
    }
  }, 500);
}

function arriveHome() {
  state = STATE.IDLE;
  
  // 更新访问追踪
  if (!destinationTracker[currentDest.name]) {
    destinationTracker[currentDest.name] = { visits: 0, nextItemIdx: 0 };
  }
  const tracker = destinationTracker[currentDest.name];
  const isRevisit = tracker.visits > 0;
  tracker.visits++;
  
  // 生成明信片
  const moodIdx = Math.floor(Math.random() * moods.length);
  
  // 旅途故事（按访问次数选不同版本）
  const travelStory = generateTravelStory(currentDest, isRevisit, tracker.visits);
  
  // 按顺序拿特产
  const itemIdx = tracker.nextItemIdx;
  if (itemIdx < currentDest.items.length) {
    tracker.nextItemIdx++;
  }
  
  const postcard = {
    id: Date.now(),
    dest: currentDest.name,
    world: currentDest.world,
    desc: currentDest.desc,
    img: currentDest.img || null,
    mood: moods[moodIdx],
    moodEmoji: moodEmojis[moodIdx],
    story: travelStory,
    time: new Date().toLocaleString(),
    isRevisit: isRevisit,
    visitCount: tracker.visits
  };
  postcardCollection.unshift(postcard);
  if (postcardCollection.length > 30) postcardCollection.pop();
  
  // 生成特产
  const souvenirName = itemIdx < currentDest.items.length ? currentDest.items[itemIdx] : currentDest.items[currentDest.items.length - 1];
  const souvenir = {
    id: Date.now() + 1,
    name: souvenirName,
    from: currentDest.name,
    world: currentDest.world
  };
  souvenirCollection.unshift(souvenir);
  if (souvenirCollection.length > 40) souvenirCollection.pop();
  
  // 旅途日志
  journeyLog.unshift({
    id: Date.now() + 2,
    dest: currentDest.name,
    world: currentDest.world,
    time: new Date().toLocaleString(),
    count: tracker.visits
  });
  if (journeyLog.length > 50) journeyLog.pop();
  
  // 全部特产拿完了？发个提示
  let hintText = "小夜回来了！带来了新的明信片和特产～🫶";
  if (!canVisitAgain(currentDest)) {
    hintText = `${currentDest.name}的所有特产都收集齐了吱～小夜暂时不会再去那里了🫶`;
  }
  
  // ========== 事件系统：触发2~3个随机事件 ==========
  const pool = eventPools[currentDest.name];
  const eventResults = [];
  let totalExpGained = 0;
  let newAccessories = [];
  
  if (pool && pool.length > 0) {
    const numEvents = 2 + Math.floor(Math.random() * 2); // 2~3件
    const shuffled = [...pool];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const selected = shuffled.slice(0, Math.min(numEvents, pool.length));
    
    for (const evt of selected) {
      const statVal = getStatValue(evt.stat);
      const dice = rollD6();
      const worldBonus = worldDifficulty[currentDest.world] || 0;
      const effectiveDifficulty = evt.difficulty + worldBonus + 2;
      const success = (statVal + dice) >= effectiveDifficulty;
      const expGain = success ? 20 : 5;
      totalExpGained += expGain;
      addStatExp(evt.stat, expGain);
      
      let gotAccessory = null;
      if (success && evt.accessory) {
        const alreadyHas = yeStats.backpack.some(a => a.name === evt.accessory.name);
        if (!alreadyHas && Math.random() < 0.3) {
          gotAccessory = { ...evt.accessory };
          yeStats.backpack.push(gotAccessory);
          newAccessories.push(gotAccessory.name);
        }
      }
      
      eventResults.push({
        name: evt.name,
        desc: evt.desc,
        stat: evt.stat,
        statVal: statVal,
        dice: dice,
        difficulty: evt.difficulty,
        effectiveDifficulty: effectiveDifficulty,
        difficultyLabel: getDifficultyLabel(effectiveDifficulty),
        success: success,
        expGain: expGain,
        resultText: success ? evt.successText : evt.failText,
        gotAccessory: gotAccessory
      });
    }
    saveYeStats();
  }
  
  // 将事件结果加入明信片
  postcard.events = eventResults;
  postcard.expGained = totalExpGained;
  postcard.newAccessories = newAccessories;
  
  if (eventResults.length > 0) {
    hintText = `小夜回来了！发生了${eventResults.length}件事，获得了${totalExpGained}点属性经验～🫶`;
    if (newAccessories.length > 0) {
      hintText = `小夜回来了！获得了新饰品【${newAccessories.join('、')}】🎉`;
    }
  }
  
  // 保存
  localStorage.setItem("yeJourneyLog", JSON.stringify(journeyLog));
  localStorage.setItem("yePostcards", JSON.stringify(postcardCollection));
  localStorage.setItem("yeSouvenirs", JSON.stringify(souvenirCollection));
  localStorage.setItem("yeDestTracker", JSON.stringify(destinationTracker));
  
  // 显示结果
  lastTravelStory = travelStory;
  lastDestName = currentDest.name;
  document.getElementById("hintText").textContent = hintText;
  updateUI();
  renderJourneyLog();
  
  // 自动切到明信片tab
  switchTab('postcards');
}

// ========== 迷雾阶段结算 ==========

function fogArrive() {
  if (!fogRun || !fogRun.active) {
    state = STATE.IDLE;
    updateUI();
    return;
  }
  
  const stage = fogRun.stages[fogRun.currentStage];
  if (!stage) {
    // 10个阶段全部完成
    const actualPassed = fogRun.passedStages;
    fogRun.bossAvailable = actualPassed >= 10;
    fogRun.currentStage = 10;
    fogRun.active = false;
    
    // 结算记忆恢复（按实际通过阶段数）
    const memoryPct = actualPassed * 10;
    fogData.memoryRestored = Math.max(fogData.memoryRestored, memoryPct);
    fogData.bestStages = Math.max(fogData.bestStages, actualPassed);
    saveFogData();
    
    state = STATE.IDLE;
    updateUI();
    document.getElementById("hintText").textContent =
      `🌫️ 10个阶段全部结束！\n` +
      `通过了 ${actualPassed} 个阶段，恢复了 ${memoryPct}% 的记忆！\n\n` +
      (actualPassed >= 10
        ? `雾中隐约出现了一个庞大的黑影……\n遗忘之主的投影就在前方。\n\n准备好了就去面对它吧！`
        : `\"我不会放弃的……再试一次吧。\"`);
    switchTab('stats');
    return;
  }
  
  // 当前阶段检定
  const statVal = getStatValue(stage.stat);
  const dice = rollD6();
  const success = (statVal + dice) >= stage.difficulty;
  
  if (success) {
    fogRun.passedStages++;
    // 对应属性加经验（迷雾事件给双倍经验）
    addStatExp(stage.stat, 40);
  } else {
    addStatExp(stage.stat, 10);
  }
  
  // 记录阶段结果
  stage.result = {
    statVal,
    dice,
    success,
    total: statVal + dice
  };
  
  fogRun.currentStage++;
  
  // 继续下一阶段
  state = STATE.IDLE;
  updateUI();
  
  const tierLabel = getFogDifficultyLabel(stage.tier);
  const resultText = success ? '成功✅' : '失败❌';
  const memoryPct = Math.min(100, fogRun.passedStages * 10);
  
  document.getElementById("hintText").textContent =
    `🌫️ 阶段 ${fogRun.currentStage}/10 ${tierLabel}\n` +
    `${STAT_NAMES[stage.stat]}检定（难度${stage.difficulty}）：属性${statVal} + 骰子${dice} = ${statVal + dice}，${resultText}\n` +
    `${stage.resultText}\n` +
    `\n已恢复记忆：${memoryPct}% | 通过：${fogRun.passedStages}/${fogRun.currentStage}`;
  
  switchTab('stats');
}

// ========== 遗忘之主战斗 ==========

function fogBossFight() {
  const boss = fogEvents.boss;
  
  // 选择最高属性来面对遗忘之主
  const stats = ['str', 'dex', 'int', 'cha'];
  let bestStat = 'str';
  let bestVal = 0;
  for (const s of stats) {
    const val = getStatValue(s);
    if (val > bestVal) {
      bestVal = val;
      bestStat = s;
    }
  }
  // getStatValue已包含装备加成
  let totalVal = bestVal;
  
  const dice = rollD6();
  const success = (totalVal + dice) >= boss.difficulty;
  
  state = STATE.IDLE;
  updateUI();
  
  if (success) {
    // 战胜遗忘之主！
    fogData.completed = true;
    fogData.memoryRestored = 100;
    fogData.bestStages = 10;
    saveFogData();
    
    // 给一大波经验
    addStatExp(bestStat, 200);
    saveYeStats();
    
    // 给最终明信片
    const finalPostcard = {
      id: Date.now(),
      dest: "✦ 记忆的尽头 ✦",
      world: "小夜的心",
      desc: "最终，小夜站在了阳光之中。\n\n遗忘之主的投影消散了，所有的记忆——那些走过的风景、笑过的瞬间、守护的宝物——全部回来了。\n\n小夜明白了：记忆之所以珍贵，不是因为它们永远不会消失，而是因为有人愿意为守护它们而战斗。",
      img: "memory_end",
      mood: "感动",
      moodEmoji: "🥹",
      story: ["小夜战胜了遗忘。不是因为力量有多强，而是因为——有些回忆，比恐惧更强。"],
      time: new Date().toLocaleString(),
      isRevisit: false,
      visitCount: 1,
      events: [],
      expGained: 200
    };
    postcardCollection.unshift(finalPostcard);
    localStorage.setItem("yePostcards", JSON.stringify(postcardCollection));
    
    document.getElementById("hintText").textContent =
      `🌟 小夜战胜了遗忘之主的投影！\n\n${STAT_NAMES[bestStat]}检定（难度${boss.difficulty}）：属性${totalVal} + 骰子${dice} = ${totalVal + dice}，成功✅\n\n${boss.successText}\n\n☀️ 所有的记忆都回来了！小夜获得了终局明信片：【✦ 记忆的尽头 ✦】`;
    switchTab('postcards');
  } else {
    // 失败
    addStatExp(bestStat, 20);
    saveYeStats();
    
    // 保留已恢复的记忆，但boss战后可以继续挑战
    document.getElementById("hintText").textContent =
      `💀 小夜被遗忘之主的投影击倒了……\n\n${STAT_NAMES[bestStat]}检定（难度${boss.difficulty}）：属性${totalVal} + 骰子${dice} = ${totalVal + dice}，失败❌\n\n${boss.failText}\n\n已恢复的记忆：${fogData.memoryRestored}%\n但小夜不会放弃——\"再试一次……一定能想起来……\"`;
    switchTab('stats');
  }
}

  if (!currentDest) {
    state = STATE.IDLE;
    updateUI();
    return;
  }
  
  const pool = eventPools[currentDest.name];
  const eventResults = [];
  let totalExpGained = 0;
  
  if (pool && pool.length > 0) {
    const numEvents = 2 + Math.floor(Math.random() * 2);
    const shuffled = [...pool];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const selected = shuffled.slice(0, Math.min(numEvents, pool.length));
    
    for (const evt of selected) {
      const statVal = getStatValue(evt.stat);
      const dice = rollD6();
      const worldBonus = worldDifficulty[currentDest.world] || 0;
      const effectiveDifficulty = evt.difficulty + worldBonus + 2;
      const success = (statVal + dice) >= effectiveDifficulty;
      const expGain = success ? 20 : 5;
      totalExpGained += expGain;
      addStatExp(evt.stat, expGain);

  if (!journeyLog || journeyLog.length === 0) return '';

      <div class="postcard-title" style="font-size:14px;">📍 ${log.dest}</div>

  `).join("");
}

// ========== 选项卡切换 ==========

function switchTab(tabId) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  
  event.target.closest(".tab").classList.add("active");
  document.getElementById(`tab-${tabId}`).classList.add("active");
  
  if (tabId === "postcards") renderPostcards();
  else if (tabId === "album") renderAlbum();
  else if (tabId === "stats") renderStats();
  else if (tabId === "equipment") renderEquipment();
}

        : `<div class="postcard-text" style="white-space:pre-line;">${pc.story ? pc.story.join('\n\n') : pc.desc}</div>`
      }
      ${!isFogged && pc.events && pc.events.length > 0 ? pc.events.map(e => `
        <div style="margin-top:8px;padding:8px;background:#f5f0e8;border-radius:6px;font-size:13px;">
          <b>🎲 ${e.name}</b><br>
          <span style="color:#8b7355;">${e.desc}</span><br>
          <span style="color:#6a5a4a;">${STAT_NAMES[e.stat]}检定（难度${e.effectiveDifficulty || e.difficulty}${e.difficultyLabel || ''}）：属性${e.statVal} + 骰子${e.dice} = ${e.statVal+e.dice}${e.success ? '，成功✅' : '，失败❌'}</span><br>
          <span>${e.resultText}</span><br>
          <span style="color:#a07040;">获得${STAT_NAMES[e.stat]}经验+${e.expGain}</span>
          ${e.gotAccessory ? `<br><span style="color:#9b59b6;">✨ 获得饰品：${(() => { const p = getAccessoryIcon(e.gotAccessory.name); return p ? `<img src="${p}" style="width:20px;height:20px;vertical-align:middle;border-radius:3px;"> ` : '✨ '; })()}${e.gotAccessory.name}</span>` : ''}
        </div>
      `).join('\n') : ''}
    </div>`;
    })()}
  `).join("");
  
  // 旅行统计（小图标）
  const totalTrips = journeyLog.length;
  const visitedDests = new Set(journeyLog.map(l => l.dest)).size;
  if (totalTrips > 0) {
    html += '<div style="margin-top:16px;padding:12px;background:#f0e6d8;border-radius:8px;font-size:13px;color:#6a5a4a;text-align:center;">';
    html += `🚀 共 ${totalTrips} 次旅行 · 🗺️ ${visitedDests} 个目的地`;
    html += '</div>';
  }
  
  el.innerHTML = html;
}

  const pool = isRevisit ? vibes.revisit : vibes.first;
  const idx = isRevisit
    ? Math.min((visitCount - 2) % pool.length, pool.length - 1)
    : 0;

  const arriveText = fillDest(template.arrive);
  
  return [startText, middleText, nearText, arriveText];

// ========== 删档重玩 ==========
let resetPending = false;

function confirmReset() {
  const btn = document.getElementById("resetBtn");
  if (!resetPending) {
    resetPending = true;
    btn.textContent = "⚠️ 真的删掉吗？再点一次确认";
    btn.style.background = "#8a2a2a";
    setTimeout(() => {
      resetPending = false;
      btn.textContent = "🗑️ 删档重玩";
      btn.style.background = "#6a3a3a";
    }, 8000);
  } else {
    // 删档
    localStorage.removeItem("yeJourneyLog");
    localStorage.removeItem("yePostcards");
    localStorage.removeItem("yeSouvenirs");
    localStorage.removeItem("yeDestTracker");
    localStorage.removeItem("yeFogData");
    
    journeyLog = [];
    postcardCollection = [];
    souvenirCollection = [];
    destinationTracker = {};
    fogData = { unlocked: false, completed: false, bestStages: 0, memoryRestored: 0 };
    lastTravelStory = null;
    lastDestName = null;
    currentDest = null;
    
    resetPending = false;
    btn.textContent = "🗑️ 删档重玩";
    btn.style.background = "#6a3a3a";
    
    document.getElementById("hintText").textContent = "小夜的记忆全部清空啦～可以重新出发了吱🫶";
    updateUI();
    switchTab('stats');
  }
}

// ========== 保存/加载进度 ==========

function saveProgress() {
  const data = {
    journeyLog,
    postcardCollection,
    souvenirCollection,
    destinationTracker,
    fogData,
    savedAt: new Date().toLocaleString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `小夜旅行存档_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  
  const hint = document.getElementById("hintText");
  hint.textContent = "💾 进度保存好啦～下次打开点「读取进度」就能恢复吱！";
  setTimeout(() => { hint.textContent = "小夜在休憩之所等你回来～🫶"; }, 3000);
}

function loadProgress(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.journeyLog) journeyLog = data.journeyLog;
      if (data.postcardCollection) postcardCollection = data.postcardCollection;
      if (data.souvenirCollection) souvenirCollection = data.souvenirCollection;
      if (data.destinationTracker) destinationTracker = data.destinationTracker;
      if (data.fogData) { fogData = data.fogData; localStorage.setItem("yeFogData", JSON.stringify(fogData)); }
      
      document.getElementById("hintText").textContent = "📂 进度读取成功！小夜还记得所有旅行记忆哦～🫶";
      updateUI();
      switchTab('stats');
    } catch(err) {
      document.getElementById("hintText").textContent = "读取失败了吱...文件好像不对😣";
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ========== 启动 ==========
// 如果有之前的旅途中被打断，重置
if (state === STATE.IDLE) {
  document.getElementById("hintText").textContent = "休息够了就再出发吧～等你回来吱🫶";
}
updateUI();

// 注册 Service Worker（PWA安装支持）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

// ========== 页面可见性变化 ==========
// 从后台切回来时保证倒计时准确
document.addEventListener('visibilitychange', function() {
  if (!document.hidden && (state === STATE.TRAVELING || state === STATE.FOG || state === STATE.TRAINING) && travelStartTime > 0) {
    const elapsed = Math.floor((Date.now() - travelStartTime) / 1000);
    timeRemaining = Math.max(0, totalTime - elapsed);
    updateUI();
    if (timeRemaining <= 0) {
      clearInterval(travelTimer);
      if (state === STATE.TRAVELING) arriveHome();
      else if (state === STATE.FOG) fogArrive();
      else if (state === STATE.TRAINING) freeTravelArrive();
    }
  }
});
</script>

<!-- 全图查看灯箱 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightboxImg" src="" alt="全图">
</div>

<script>
// ========== 灯箱（全图查看） ==========
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  img.src = src;
  lb.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  const lb = document.getElementById('lightbox');
  lb.classList.remove('active');
  document.body.style.overflow = '';
}

// ESC键关闭
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});

// 阻止点击图片关闭（点击背景才关闭）
document.getElementById('lightboxImg').addEventListener('click', function(e) {
  e.stopPropagation();
});

function renderAlbum() {
  var el = document.getElementById("tab-album");
  var collected = {};
  souvenirCollection.forEach(function(s) { collected[s.name] = true; });
  var allItems = [];
  destinations.forEach(function(d) {
    d.items.forEach(function(name) {
      allItems.push({ name: name, dest: d.name, world: d.world });
    });
  });
  var grouped = {};
  allItems.forEach(function(item) {
    if (!grouped[item.dest]) grouped[item.dest] = { world: item.world, items: [] };
    grouped[item.dest].items.push(item.name);
  });
  var htmlStr = "";
  var destNames = Object.keys(grouped);
  destNames.forEach(function(dest) {
    var info = grouped[dest];
    var collectedCount = 0;
    info.items.forEach(function(n) { if (collected[n]) collectedCount++; });
    var total = info.items.length;
    var allCollected = collectedCount === total;
    var icon = allCollected ? "\u2B50" : "\uD83C\uDF81";
    htmlStr += "<div class=\'postcard fade-slide\'>";
    htmlStr += "<div class=\'postcard-title\'>" + icon + " " + dest + "</div>";
    htmlStr += "<div class=\'postcard-from\'>" + info.world + " \u00B7 " + collectedCount + "/" + total + "</div>";
    htmlStr += "<div class=\'album-grid\'>";
    info.items.forEach(function(name) {
      var has = collected[name];
      var iconPath = itemIconMap[name] || "";
      if (has && iconPath) {
        var fogClass = (fogData.unlocked && !fogData.completed) ? ' style="filter:grayscale(0.8)brightness(0.6);"' : '';
        htmlStr += "<div class=\'album-item\' onclick=\'openLightbox(\"" + iconPath + "\")\'><img src=\"" + iconPath + "\" class=\'album-icon\'" + fogClass + "><span class=\'album-name\'>" + name + "</span></div>";
      } else {
        htmlStr += "<div class=\'album-item\'><div class=\'album-placeholder\'>?</div><span class=\'album-name missing\'>" + name + "</span></div>";
      }
    });
    htmlStr += "</div></div>";
  });
  // 已经收集的特产
  var souvenirNames = {};
  souvenirCollection.forEach(function(s) { souvenirNames[s.name] = true; });
  var collectedCount = Object.keys(souvenirNames).length;
  
  if (collectedCount > 0) {
    htmlStr += '<div style="margin-top:20px;"><h3 style="color:#3a2450;font-size:16px;margin-bottom:8px;">🎁 已收集特产（' + collectedCount + '/' + allItems.length + '）</h3>';
    htmlStr += '<div style="display:flex;flex-wrap:wrap;gap:6px;">';
    souvenirCollection.forEach(function(s) {
      var iconPath = itemIconMap[s.name] || "";
      if (iconPath) {
        htmlStr += '<div style="text-align:center;width:60px;"><img src="' + iconPath + '" style="width:40px;height:40px;border-radius:6px;object-fit:contain;"><div style="font-size:10px;color:#8b7355;overflow:hidden;text-overflow:ellipsis;">' + s.name + '</div></div>';
      }
    });
    htmlStr += '</div></div>';
  }
  
  el.innerHTML = htmlStr;
}

// ========== 属性面板 ==========

function renderStats() {
  const el = document.getElementById("tab-stats");
  
  const STAT_ICONS = { str: "💪", dex: "🏃", int: "🧠", cha: "💬" };
  
  let html = '<div style="padding:16px;">';
  
  // 每个属性条
  const stats = ["str", "dex", "int", "cha"];
  for (const s of stats) {
    const level = yeStats.level[s] || 1;
    const exp = yeStats.exp[s] || 0;
    const expToNext = (level * 100 + 50);
    const val = getStatValue(s);
    const pct = Math.min(100, Math.floor(exp / expToNext * 100));
    
    // 装备加成(显示用)
    let bonusStr = "";
    (yeStats.equipment || []).forEach(eq => {
      if (eq && eq.stat === s) bonusStr += ` +${eq.bonus}(${eq.name})`;
    });
    const totalVal = val;
    
    html += `
      <div style="margin-bottom:16px;background:#f5f0e8;border-radius:8px;padding:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span><b>${STAT_ICONS[s]} ${STAT_NAMES[s]}</b> Lv.${level}</span>
          <span style="font-size:20px;color:#3a2450;font-weight:bold;">${totalVal}${bonusStr}</span>
        </div>
        <div style="margin-top:6px;height:8px;background:#ddd;border-radius:4px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#8b6bc0,#b896e0);border-radius:4px;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#8b7355;margin-top:3px;">
          <span>经验 ${exp}/${expToNext}</span>
        </div>
      </div>`;
  }
  
  // 迷雾模式记忆恢复进度
  if (fogData.unlocked) {
    const pct = fogData.memoryRestored || 0;
    html += `
      <div style="margin-top:16px;padding:12px;background:${fogData.completed ? '#e8f5e8' : '#f0e6d8'};border-radius:8px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#3a2450;">
          <span>🌫️ 记忆恢复</span>
          <span>${pct}%</span>
        </div>
        <div style="margin-top:6px;height:8px;background:#ddd;border-radius:4px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:${fogData.completed ? 'linear-gradient(90deg,#6bc0a0,#8be0c0)' : 'linear-gradient(90deg,#8b6bc0,#b896e0)'};border-radius:4px;"></div>
        </div>
        ${fogData.completed ? '<div style="margin-top:4px;font-size:12px;color:#6a9a6a;">☀️ 所有记忆已找回！</div>' : ''}
      </div>`;
  }
  
  html += '</div>';
  el.innerHTML = html;
}

// ========== 装备面板 ==========

function renderEquipment() {
  const el = document.getElementById("tab-equipment");
  const STAT_ICONS = { str: "💪", dex: "🏃", int: "🧠", cha: "💬" };
  
  let html = '<div style="padding:16px;">';
  
  // 当前装备
  html += '<div style="margin-bottom:16px;background:#f0e6d8;border-radius:8px;padding:12px;">';
  html += '<b style="font-size:15px;color:#3a2450;">🎒 当前装备</b>';
  const equippedItems = yeStats.equipment.filter(e => e);
  if (equippedItems.length === 0) {
    html += '<div style="color:#8b7355;padding:8px;font-size:14px;">还没有装备饰品呢～</div>';
  } else {
    for (const eq of equippedItems) {
      const iconPath = getAccessoryIcon(eq.name);
      html += `
        <div style="margin-top:8px;padding:8px 12px;background:#8b6bc0;color:#fff;border-radius:8px;font-size:14px;display:flex;align-items:center;gap:8px;">
          ${iconPath ? `<img src="${iconPath}" style="width:30px;height:30px;border-radius:4px;object-fit:contain;">` : '✅'}
          <span>${eq.name} <span style="font-size:12px;color:#ddd;">(${STAT_ICONS[eq.stat]} ${STAT_NAMES[eq.stat]}+${eq.bonus})</span></span>
        </div>`;
    }
  }
  html += '</div>';
  
  // 背包
  html += '<div style="margin-bottom:12px;"><b style="font-size:15px;color:#3a2450;">📦 背包</b></div>';
  if (yeStats.backpack.length === 0) {
    html += '<div style="color:#8b7355;padding:8px;font-size:14px;">还没有饰品呢～去旅行中探索吧！</div>';
  } else {
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">';
    for (const item of yeStats.backpack) {
      const equipped = yeStats.equipment.some(eq => eq && eq.name === item.name);
      const iconPath = getAccessoryIcon(item.name);
      html += `
        <div onclick="toggleEquip('${item.name}')" style="
          padding:8px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;
          background:${equipped ? '#8b6bc0' : '#f0e6d8'};color:${equipped ? '#fff' : '#2a1a3a'};
          border:1px solid #d4b896;font-size:14px;">
          ${iconPath ? `<img src="${iconPath}" style="width:24px;height:24px;border-radius:4px;object-fit:contain;">` : (equipped ? '✅ ' : '')}
          <span>${item.name} <span style="font-size:12px;color:${equipped ? '#ddd' : '#8b7355'};">(${STAT_ICONS[item.stat]} ${STAT_NAMES[item.stat]}+${item.bonus})</span></span>
        </div>`;
    }
    html += '</div>';
  }
  
  // 装备说明
  html += `
    <div style="margin-top:16px;padding:12px;background:#f0e6d8;border-radius:8px;font-size:13px;color:#6a5a4a;">
      📌 可装备2个饰品，点击切换装备/卸下
      <br>📌 同属性效果叠加
    </div>`;
  
  html += '</div>';
  el.innerHTML = html;
}

// ========== 饰品装备/卸下 ==========

function toggleEquip(name) {
  const item = yeStats.backpack.find(i => i.name === name);
  if (!item) return;
  
  const idx = yeStats.equipment.findIndex(eq => eq && eq.name === name);
  if (idx >= 0) {
    // 卸下
    yeStats.equipment[idx] = null;
  } else {
    // 装备到第一个空位
    const emptyIdx = yeStats.equipment.findIndex(eq => eq === null);
    if (emptyIdx >= 0) {
      yeStats.equipment[emptyIdx] = item;
    } else {
      // 替换第一个
      yeStats.equipment[0] = item;
    }
  }
  saveYeStats();
  // 刷新当前显示的标签页
  const activeTab = document.querySelector('.tab-content.active');
  if (activeTab) {
    const tabId = activeTab.id.replace('tab-', '');
    if (tabId === 'stats') renderStats();
    else if (tabId === 'equipment') renderEquipment();
  }
}
</script>
